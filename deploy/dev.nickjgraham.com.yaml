kind: Service
apiVersion: v1
metadata:
  name: devnickjgrahamcom
  namespace: devnickjgrahamcom
spec:
  selector:
    app: devnickjgrahamcom
  type: NodePort
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devnickjgrahamcom
  namespace: devnickjgrahamcom
  labels:
    app: devnickjgrahamcom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devnickjgrahamcom

  template:
    metadata:
      labels:
        app: devnickjgrahamcom
  
    spec:
      containers:
      - name: devnickjgrahamcom
        image: nicholasjgraham/nickjgraham.com:latest
        imagePullPolicy: Always
        env:
          - name: LOG_LEVEL
            value: "DEBUG"
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
        readinessProbe:
            failureThreshold: 3
            successThreshold: 1
            initialDelaySeconds: 0
            timeoutSeconds: 1
            periodSeconds: 10
            httpGet:
              scheme: HTTP
              port: 8080
              path: /health
        startupProbe:
            failureThreshold: 3
            successThreshold: 1
            initialDelaySeconds: 1
            timeoutSeconds: 1
            periodSeconds: 10
            httpGet:
              scheme: HTTP
              port: 8080
              path: /ping
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app: devnickjgrahamcom
  name: devnickjgrahamcom
  namespace: devnickjgrahamcom
spec:
  rules:
  - host: dev.nickjgraham.com
    http:
      paths:
      - backend:
          service:
            name: devnickjgrahamcom
            port:
              number: 8080
        path: /
        pathType: Prefix
  tls:
    - hosts:
      - dev.nickjgraham.com
      - devnickjgraham.nickwork.net
      secretName: wildcard.nickwork.net
